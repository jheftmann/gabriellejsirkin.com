[build]
  command   = "npm ci && node build.js"
  publish   = "."

[build.processing.html]
  pretty_urls = true

# Production — always build from published Sanity content
[context.production.environment]
  SANITY_API_PERSPECTIVE = "publishedOnly"

# Branch / preview deploys — build from Sanity drafts so editors can preview
# unpublished changes before hitting Publish in the Studio.
[context.branch-deploy]
  command = "npm ci && node build.js"
  publish = "."

[context.branch-deploy.environment]
  SANITY_API_PERSPECTIVE = "previewDrafts"

# Explicit draft branch config (kept for Sveltia CMS compat during migration)
[context.draft]
  command = "npm ci && node build.js"
  publish = "."
